name: ecooptimize_mobile
description: Dashboard mobile EcoOptimize - suivi temps reel de production/consommation d'energie
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2       # gestion d'etat (ChangeNotifier)
  http: ^1.2.2           # appels API REST
  intl: ^0.19.0          # formatage dates/nombres
  fl_chart: ^0.69.0      # graphique de l'historique par noeud
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
